<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мессенджер</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #6b7280;
    --line: #e3e5e8; --accent: #1f6feb; --mine: #d9e8ff; --theirs: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8eb; --muted: #8b93a1;
      --line: #262b35; --accent: #4c8dff; --mine: #1d3357; --theirs: #1f232c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  button, input { font: inherit; color: inherit; }
  button {
    border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    padding: 10px 16px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); padding: 8px 10px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); outline: none;
  }
  input:focus { border-color: var(--accent); }

  /* Login */
  #login {
    height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; width: 100%; max-width: 360px; display: grid; gap: 14px;
  }
  .card h1 { margin: 0; font-size: 22px; }
  .card p { margin: 0; color: var(--muted); }

  /* App */
  #app { height: 100%; display: none; grid-template-columns: 240px 1fr; }
  #app.on { display: grid; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .me { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .me b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rooms { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  #rooms li {
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #rooms li:hover { background: var(--bg); }
  #rooms li.active { background: var(--accent); color: #fff; }
  #newRoom { padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
  #newRoom button { padding: 10px 14px; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 8px;
  }
  header h2 { margin: 0; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #back { display: none; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg {
    max-width: min(75%, 560px); padding: 8px 12px; border-radius: 14px;
    background: var(--theirs); border: 1px solid var(--line); align-self: flex-start;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.mine { background: var(--mine); align-self: flex-end; border-color: transparent; }
  .msg .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .msg .time { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  form#send {
    display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel);
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #status { font-size: 12px; color: var(--muted); }

  @media (max-width: 680px) {
    #app.on { grid-template-columns: 1fr; }
    #app.in-room aside { display: none; }
    #app:not(.in-room) main { display: none; }
    #back { display: inline-block; }
  }
</style>
</head>
<body>

<section id="login">
  <form class="card" id="loginForm">
    <h1>💬 Мессенджер</h1>
    <p>Как тебя зовут? Это имя увидят другие.</p>
    <input id="nameInput" maxlength="30" placeholder="Твоё имя" autocomplete="nickname" required>
    <button type="submit">Войти</button>
  </form>
</section>

<section id="app">
  <aside>
    <div class="me"><b id="meName"></b><button class="ghost" id="logout" type="button">Выйти</button></div>
    <ul id="rooms"></ul>
    <form id="newRoom">
      <input id="roomInput" maxlength="30" placeholder="Новая комната">
      <button type="submit" title="Создать">+</button>
    </form>
  </aside>
  <main>
    <header>
      <button class="ghost" id="back" type="button">←</button>
      <h2 id="roomTitle">Выбери комнату</h2>
      <span id="status"></span>
    </header>
    <div id="messages"><div class="empty">Выбери комнату слева или создай новую</div></div>
    <form id="send">
      <input id="textInput" maxlength="1000" placeholder="Сообщение…" autocomplete="off" disabled>
      <button type="submit" id="sendBtn" disabled>➤</button>
    </form>
  </main>
</section>

<script>
const $ = (id) => document.getElementById(id);
const ROOM_RE = /^[\p{L}\p{N} _-]{1,30}$/u;
const POLL_MS = 3000;

let me = null;
let room = null;
let lastId = "";
let rooms = [];
let pollTimer = null;
let polling = false;

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

async function api(path, opts) {
  const res = await fetch("/api/" + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Ошибка " + res.status);
  return data;
}

function setStatus(t) { $("status").textContent = t; }

/* ---------- login ---------- */
function login(name) {
  me = name;
  lsSet("chat.name", name);
  $("meName").textContent = name;
  $("login").style.display = "none";
  $("app").classList.add("on");
  loadRooms().then(() => {
    const saved = lsGet("chat.room");
    if (saved && ROOM_RE.test(saved) && window.innerWidth > 680) openRoom(saved);
  });
}

$("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("nameInput").value.trim();
  if (name) login(name);
});

$("logout").addEventListener("click", () => {
  lsSet("chat.name", null);
  location.reload();
});

/* ---------- rooms ---------- */
async function loadRooms() {
  try {
    const data = await api("rooms");
    rooms = data.rooms;
    if (!rooms.includes("Общий")) rooms.unshift("Общий");
    if (room && !rooms.includes(room)) rooms.push(room);
    renderRooms();
  } catch (err) { setStatus(err.message); }
}

function renderRooms() {
  const ul = $("rooms");
  ul.innerHTML = "";
  for (const r of rooms) {
    const li = document.createElement("li");
    li.textContent = "# " + r;
    if (r === room) li.className = "active";
    li.onclick = () => openRoom(r);
    ul.appendChild(li);
  }
}

$("newRoom").addEventListener("submit", (e) => {
  e.preventDefault();
  const r = $("roomInput").value.trim();
  if (!ROOM_RE.test(r)) {
    alert("Название: до 30 символов — буквы, цифры, пробел, _ или -");
    return;
  }
  $("roomInput").value = "";
  if (!rooms.includes(r)) rooms.push(r);
  openRoom(r);
});

function openRoom(r) {
  room = r;
  lastId = "";
  lsSet("chat.room", r);
  $("roomTitle").textContent = "# " + r;
  $("messages").innerHTML = '<div class="empty">Загрузка…</div>';
  $("textInput").disabled = false;
  $("sendBtn").disabled = false;
  $("app").classList.add("in-room");
  renderRooms();
  poll(true);
  if (window.innerWidth > 680) $("textInput").focus();
}

$("back").addEventListener("click", () => {
  $("app").classList.remove("in-room");
  loadRooms();
});

/* ---------- messages ---------- */
function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const t = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString("ru-RU") + " " + t;
}

function addMessages(list, fromPoll) {
  const box = $("messages");
  if (!list.length) {
    if (!box.querySelector(".msg")) box.innerHTML = '<div class="empty">Тут пока пусто. Напиши первым!</div>';
    return;
  }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  for (const m of list) {
    if (fromPoll && m.id > lastId) lastId = m.id;
    if (box.querySelector(`[data-id="${m.id}"]`)) continue;
    const div = document.createElement("div");
    div.className = "msg" + (m.name === me ? " mine" : "");
    div.dataset.id = m.id;
    if (m.name !== me) {
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = m.name;
      div.appendChild(who);
    }
    div.appendChild(document.createTextNode(m.text));
    const time = document.createElement("div");
    time.className = "time";
    time.textContent = fmtTime(m.ts);
    div.appendChild(time);
    const after = [...box.querySelectorAll(".msg")].find((el) => el.dataset.id > m.id);
    box.insertBefore(div, after || null);
  }
  if (atBottom || list.some((m) => m.name === me)) box.scrollTop = box.scrollHeight;
}

async function poll(first) {
  clearTimeout(pollTimer);
  if (!room) return;
  if (polling && !first) return schedule();
  polling = true;
  const forRoom = room;
  try {
    const q = "room=" + encodeURIComponent(forRoom) + (lastId ? "&since=" + lastId : "");
    const data = await api("messages?" + q);
    if (forRoom === room) {
      addMessages(data.messages, true);
      if (first) $("messages").scrollTop = $("messages").scrollHeight;
      setStatus("");
    }
  } catch (err) {
    setStatus("нет связи…");
  } finally {
    polling = false;
    schedule();
  }
}

function schedule() {
  clearTimeout(pollTimer);
  if (document.visibilityState === "visible") pollTimer = setTimeout(() => poll(false), POLL_MS);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") poll(false);
  else clearTimeout(pollTimer);
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("textInput");
  const text = input.value.trim();
  if (!text || !room) return;
  input.value = "";
  try {
    const msg = await api("messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ room, name: me, text }),
    });
    if (msg.room === room) addMessages([msg], false);
    if (!rooms.includes(room)) { rooms.push(room); renderRooms(); }
  } catch (err) {
    input.value = text;
    alert("Не отправилось: " + err.message);
  }
  input.focus();
});

/* ---------- start ---------- */
const savedName = lsGet("chat.name");
if (savedName) login(savedName);
else $("nameInput").focus();
</script>
</body>
</html>
