<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Сообщения</title>
<style>
  :root {
    --bg: #ffffff;
    --side: #f5f5f7;
    --text: #1d1d1f;
    --muted: #86868b;
    --sep: rgba(60, 60, 67, 0.12);
    --blue: #007aff;
    --red: #ff3b30;
    --bubble: #e9e9eb;
    --field: rgba(118, 118, 128, 0.12);
    --bar: rgba(255, 255, 255, 0.72);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --side: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --sep: rgba(84, 84, 88, 0.45);
      --blue: #0a84ff;
      --red: #ff453a;
      --bubble: #26252a;
      --field: rgba(118, 118, 128, 0.24);
      --bar: rgba(22, 22, 24, 0.72);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    letter-spacing: -0.01em;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  input { border: 0; outline: none; background: var(--field); border-radius: 10px; padding: 9px 14px; width: 100%; }
  input::placeholder { color: var(--muted); }
  [hidden] { display: none !important; }
  svg { display: block; }

  /* ---------- Welcome ---------- */
  #login {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center;
  }
  .logo {
    width: 76px; height: 76px; border-radius: 18px;
    background: linear-gradient(180deg, #5ac8fa, #007aff);
    display: grid; place-items: center; margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0, 122, 255, 0.25);
  }
  .logo svg { width: 40px; height: 40px; }
  #login h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  #login p { color: var(--muted); margin: 0 0 32px; max-width: 320px; }
  #loginForm { width: 100%; max-width: 320px; display: grid; gap: 10px; }
  #loginForm input { padding: 14px 16px; border-radius: 12px; }
  #loginError { color: var(--red); font-size: 14px; min-height: 18px; }
  .primary {
    background: var(--blue); color: #fff; font-weight: 600;
    border-radius: 12px; padding: 14px 16px; margin-top: 4px;
    transition: opacity .15s;
  }
  .primary:active { opacity: .7; }
  .primary:disabled { opacity: .5; }

  /* ---------- Layout ---------- */
  #app { height: 100%; display: none; grid-template-columns: 320px 1fr; }
  #app.on { display: grid; }

  aside {
    background: var(--side); border-right: 0.5px solid var(--sep);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { padding: 18px 16px 10px; padding-top: max(18px, env(safe-area-inset-top)); }
  .side-top { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
  .link { color: var(--blue); font-size: 17px; }
  .link:active { opacity: .5; }
  .side-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 6px; }

  #newPanel { padding: 4px 0 6px; display: grid; gap: 10px; }
  .segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--field); border-radius: 9px; padding: 2px; }
  .segment button { border-radius: 7px; padding: 5px 0; font-size: 14px; font-weight: 500; }
  .segment button.on { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #groupForm { display: flex; gap: 8px; }
  #userList { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  #userList li { padding: 8px 6px; display: flex; gap: 10px; align-items: center; border-radius: 10px; cursor: pointer; }
  #userList li:active { opacity: .6; }
  #userList .hint { color: var(--muted); font-size: 14px; cursor: default; }

  #convs { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; flex: 1; }
  .section { font-size: 13px; color: var(--muted); padding: 12px 10px 4px; text-transform: uppercase; letter-spacing: .02em; }
  #convs li.conv {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; border-radius: 12px; cursor: pointer;
  }
  #convs li.conv:active { opacity: .6; }
  #convs li.conv.active { background: var(--blue); color: #fff; }
  #convs li.conv.active .sub { color: rgba(255, 255, 255, .75); }
  .avatar {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 18px;
    background: linear-gradient(180deg, #a1a1a6, #7c7c80);
  }
  .avatar.sm { width: 30px; height: 30px; font-size: 13px; }
  .avatar.xs { width: 32px; height: 32px; font-size: 14px; }
  .conv-text { min-width: 0; flex: 1; }
  .conv-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-line { padding: 12px 18px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 0.5px solid var(--sep); font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; }

  /* ---------- Chat ---------- */
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
  header {
    position: sticky; top: 0; z-index: 2;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--bar);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--sep);
  }
  #back { justify-self: start; display: inline-flex; visibility: hidden; align-items: center; gap: 2px; }
  #back svg { width: 12px; height: 20px; }
  .title { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .title b { font-size: 13px; font-weight: 500; }
  #status { justify-self: end; font-size: 13px; color: var(--muted); }

  #messages {
    flex: 1; overflow-y: auto; padding: 12px 16px 8px;
    display: flex; flex-direction: column;
  }
  #messages > * { flex-shrink: 0; }
  .empty, .placeholder { margin: auto; color: var(--muted); text-align: center; font-size: 15px; }
  .stamp { align-self: center; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .who { font-size: 12px; color: var(--muted); margin: 8px 0 2px 14px; }
  .msg {
    max-width: min(72%, 520px); padding: 8px 14px;
    border-radius: var(--radius);
    background: var(--bubble); align-self: flex-start;
    white-space: pre-wrap; overflow-wrap: anywhere;
    margin-top: 2px;
    animation: pop .18s ease-out;
  }
  .msg.mine { background: var(--blue); color: #fff; align-self: flex-end; }
  .msg.media { padding: 0; overflow: hidden; background: transparent; line-height: 0; max-width: min(260px, 72%); }
  .msg.media img, .msg.media video {
    display: block; max-width: 100%; max-height: 340px; width: auto; height: auto;
    border-radius: var(--radius); cursor: pointer; background: var(--field);
  }
  .msg.media video { cursor: default; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

  /* voice bubble */
  .voice { display: flex; align-items: center; gap: 10px; min-width: 190px; padding: 2px 0; }
  .voice .play {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; background: var(--blue); color: #fff;
  }
  .msg.mine .voice .play { background: #fff; color: var(--blue); }
  .voice .play svg { width: 12px; height: 12px; }
  .voice .track { flex: 1; height: 4px; border-radius: 2px; background: rgba(128,128,128,.35); position: relative; cursor: pointer; }
  .msg.mine .voice .track { background: rgba(255,255,255,.4); }
  .voice .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: currentColor; }
  .voice .time { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .8; min-width: 34px; text-align: right; }

  /* composer: controls on the left, away from the Netlify badge in the bottom-right corner */
  form#send {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: var(--bar);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--sep);
  }
  .icon-btn {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; color: var(--muted);
    transition: opacity .15s, transform .15s;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn svg { width: 22px; height: 22px; }
  #sendBtn { background: var(--blue); color: #fff; width: 32px; height: 32px; }
  #sendBtn svg { width: 16px; height: 16px; }
  #textInput { border-radius: 20px; padding: 8px 16px; background: transparent; border: 1px solid var(--sep); flex: 1; min-width: 0; }
  #recBar { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 6px; min-width: 0; }
  #recBar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  #recTime { font-variant-numeric: tabular-nums; }
  #recCancel { margin-left: auto; color: var(--red); font-size: 15px; }
  @keyframes blink { 50% { opacity: .2; } }

  #viewer {
    position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.92);
    display: grid; place-items: center; cursor: zoom-out;
  }
  #viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }

  @media (max-width: 700px) {
    #app.on { grid-template-columns: 1fr; }
    aside { border-right: 0; background: var(--bg); }
    #convs li.conv.active { background: transparent; color: inherit; }
    #convs li.conv.active .sub { color: var(--muted); }
    #app.in-room aside { display: none; }
    #app:not(.in-room) main { display: none; }
    #back { visibility: visible; }
  }
</style>
</head>
<body>

<section id="login">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.48 3 2 6.92 2 11.75c0 2.65 1.35 5.02 3.48 6.62-.12 1.3-.6 2.5-1.43 3.38 1.8-.1 3.4-.78 4.6-1.82.98.27 2.1.42 3.35.42 5.52 0 10-3.92 10-8.6S17.52 3 12 3z"/></svg>
  </div>
  <h1>Сообщения</h1>
  <p>Впервые здесь? Придумай имя и пароль — аккаунт создастся сам.</p>
  <form id="loginForm">
    <input id="nameInput" maxlength="30" placeholder="Имя" autocomplete="username" required>
    <input id="passInput" type="password" minlength="4" placeholder="Пароль" autocomplete="current-password" required>
    <div id="loginError"></div>
    <button class="primary" type="submit" id="loginBtn">Продолжить</button>
  </form>
</section>

<section id="app">
  <aside>
    <div class="side-head">
      <div class="side-top">
        <span></span>
        <button class="link" id="newBtn" type="button" aria-label="Новый чат">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <h1>Чаты</h1>
      <div id="newPanel" hidden>
        <div class="segment">
          <button type="button" id="segDm" class="on">Личное</button>
          <button type="button" id="segGroup">Группа</button>
        </div>
        <div id="dmPick">
          <input id="userSearch" placeholder="Поиск по имени" autocomplete="off">
          <ul id="userList"></ul>
        </div>
        <form id="groupForm" hidden>
          <input id="groupInput" maxlength="30" placeholder="Название группы">
          <button class="link" type="submit">Создать</button>
        </form>
      </div>
    </div>
    <ul id="convs"></ul>
    <div class="me-line"><span id="meName"></span><button class="link" id="logout" type="button" style="font-size:14px">Выйти</button></div>
  </aside>

  <main>
    <header>
      <button class="link" id="back" type="button">
        <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
        Чаты
      </button>
      <div class="title"><div class="avatar sm" id="convAvatar">#</div><b id="convTitle">Выберите чат</b></div>
      <span id="status"></span>
    </header>
    <div id="messages"><div class="placeholder">Выберите чат слева</div></div>
    <form id="send">
      <button type="submit" id="sendBtn" class="icon-btn" disabled aria-label="Отправить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
      <button type="button" id="attachBtn" class="icon-btn" disabled aria-label="Фото или видео">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-4.5-4.5L8 19"/></svg>
      </button>
      <button type="button" id="micBtn" class="icon-btn" disabled aria-label="Голосовое сообщение">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <input id="textInput" maxlength="1000" placeholder="Сообщение" autocomplete="off" disabled>
      <div id="recBar" hidden><span class="dot"></span><span id="recTime">0:00</span><button type="button" id="recCancel">Отмена</button></div>
      <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    </form>
  </main>
</section>

<div id="viewer" hidden><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const ROOM_RE = /^[\p{L}\p{N} _-]{1,30}$/u;
const POLL_MS = 3000;
const CONV_POLL_MS = 15000;
const MAX_UPLOAD = 4 * 1024 * 1024;
const MAX_VOICE_SEC = 300;
const COLORS = [
  ["#ff9f0a", "#ff6b00"], ["#30d158", "#00a83e"], ["#64d2ff", "#0a84ff"],
  ["#bf5af2", "#8e3ad6"], ["#ff375f", "#d70040"], ["#ffd60a", "#ff9f0a"], ["#5e5ce6", "#3634a3"],
];
const ICON_PLAY = '<svg viewBox="0 0 12 12" fill="currentColor"><path d="M2.5 1.2v9.6L10.5 6z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1.5" width="2.8" height="9" rx=".6"/><rect x="7.2" y="1.5" width="2.8" height="9" rx=".6"/></svg>';

let token = null;
let me = null;
let conv = null;          // { kind: "room" | "dm", id }
let lastId = "";
let convData = { rooms: [], dms: [] };
let cache = [];
let renderedIds = [];
let pollTimer = null;
let convTimer = null;
let polling = false;
let busy = 0;

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token) headers.authorization = "Bearer " + token;
  if (opts.json) { headers["content-type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const res = await fetch("/api/" + path, { method: opts.method || "GET", headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "auth") { logout(); throw new Error("Нужно войти заново"); }
  if (!res.ok) throw new Error(data.error || "Ошибка " + res.status);
  return data;
}

function setStatus(t) { $("status").textContent = t; }
function setBusy(delta) {
  busy += delta;
  setStatus(busy > 0 ? "Отправка…" : "");
}

function paintAvatar(el, name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const [a, b] = COLORS[h % COLORS.length];
  el.style.background = `linear-gradient(180deg, ${a}, ${b})`;
  el.textContent = [...name.trim()][0]?.toUpperCase() || "#";
}
function avatarEl(name, cls = "avatar") {
  const el = document.createElement("div");
  el.className = cls;
  paintAvatar(el, name);
  return el;
}

/* ---------- login ---------- */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginError").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const data = await api("auth", { method: "POST", json: { name: $("nameInput").value, password: $("passInput").value } });
    token = data.token;
    lsSet("chat.token", token);
    lsSet("chat.name", data.name);
    $("passInput").value = "";
    start(data.name);
  } catch (err) {
    $("loginError").textContent = err.message;
  } finally {
    $("loginBtn").disabled = false;
  }
});

function start(name) {
  me = name;
  $("meName").textContent = name;
  $("login").style.display = "none";
  $("app").classList.add("on");
  loadConvs().then(() => {
    const saved = JSON.parse(lsGet("chat.conv") || "null");
    if (saved && window.innerWidth > 700) openConv(saved);
  });
  scheduleConvs();
}

function logout() {
  token = null;
  lsSet("chat.token", null);
  lsSet("chat.conv", null);
  location.reload();
}
$("logout").addEventListener("click", logout);

/* ---------- conversation list ---------- */
async function loadConvs() {
  try {
    convData = await api("conversations");
    renderConvs();
  } catch (err) { setStatus(err.message); }
}

function scheduleConvs() {
  clearTimeout(convTimer);
  convTimer = setTimeout(async () => {
    if (document.visibilityState === "visible") await loadConvs();
    scheduleConvs();
  }, CONV_POLL_MS);
}

function convItem(kind, id, sub) {
  const li = document.createElement("li");
  li.className = "conv" + (conv && conv.kind === kind && conv.id.toLowerCase() === id.toLowerCase() ? " active" : "");
  const box = document.createElement("div");
  box.className = "conv-text";
  const nm = document.createElement("div");
  nm.className = "conv-name";
  nm.textContent = id;
  const s = document.createElement("div");
  s.className = "sub";
  s.textContent = sub;
  box.append(nm, s);
  li.append(avatarEl(id), box);
  li.onclick = () => openConv({ kind, id });
  return li;
}

function renderConvs() {
  const ul = $("convs");
  ul.innerHTML = "";
  const dms = [...convData.dms];
  if (conv && conv.kind === "dm" && !dms.some((d) => d.with.toLowerCase() === conv.id.toLowerCase())) {
    dms.unshift({ with: conv.id, last: "Новый чат" });
  }
  const rooms = [...convData.rooms];
  if (!rooms.includes("Общий")) rooms.unshift("Общий");
  if (conv && conv.kind === "room" && !rooms.includes(conv.id)) rooms.push(conv.id);

  if (dms.length) {
    const h = document.createElement("li");
    h.className = "section";
    h.textContent = "Личные";
    ul.appendChild(h);
    for (const d of dms) ul.appendChild(convItem("dm", d.with, d.last || ""));
  }
  const h2 = document.createElement("li");
  h2.className = "section";
  h2.textContent = "Группы";
  ul.appendChild(h2);
  for (const r of rooms) ul.appendChild(convItem("room", r, "Группа"));
}

/* ---------- new chat panel ---------- */
$("newBtn").addEventListener("click", () => {
  const p = $("newPanel");
  p.hidden = !p.hidden;
  if (!p.hidden) { setSegment("dm"); }
});
$("segDm").addEventListener("click", () => setSegment("dm"));
$("segGroup").addEventListener("click", () => setSegment("group"));

function setSegment(which) {
  $("segDm").classList.toggle("on", which === "dm");
  $("segGroup").classList.toggle("on", which === "group");
  $("dmPick").hidden = which !== "dm";
  $("groupForm").hidden = which !== "group";
  if (which === "dm") { $("userSearch").value = ""; searchUsers(); $("userSearch").focus(); }
  else $("groupInput").focus();
}

let searchTimer = null;
$("userSearch").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchUsers, 300);
});

async function searchUsers() {
  const ul = $("userList");
  try {
    const { users } = await api("users?q=" + encodeURIComponent($("userSearch").value.trim()));
    ul.innerHTML = "";
    if (!users.length) {
      ul.innerHTML = '<li class="hint">Никого не нашлось. Друг должен сначала зайти в мессенджер.</li>';
      return;
    }
    for (const u of users) {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = u;
      li.append(avatarEl(u, "avatar xs"), span);
      li.onclick = () => { $("newPanel").hidden = true; openConv({ kind: "dm", id: u }); };
      ul.appendChild(li);
    }
  } catch (err) {
    ul.innerHTML = "";
    const li = document.createElement("li");
    li.className = "hint";
    li.textContent = err.message;
    ul.appendChild(li);
  }
}

$("groupForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const r = $("groupInput").value.trim();
  if (!ROOM_RE.test(r)) {
    alert("Название — до 30 символов: буквы, цифры, пробел, _ или -");
    return;
  }
  $("groupInput").value = "";
  $("newPanel").hidden = true;
  openConv({ kind: "room", id: r });
});

/* ---------- open conversation ---------- */
function convQuery() {
  return conv.kind === "dm" ? "dm=" + encodeURIComponent(conv.id) : "room=" + encodeURIComponent(conv.id);
}
function convBody() {
  return conv.kind === "dm" ? { dm: conv.id } : { room: conv.id };
}

function openConv(c) {
  if (recorder) cancelRecording();
  conv = c;
  lastId = "";
  cache = [];
  renderedIds = [];
  lsSet("chat.conv", JSON.stringify(c));
  $("convTitle").textContent = c.id;
  paintAvatar($("convAvatar"), c.id);
  $("messages").innerHTML = '<div class="empty">Загрузка…</div>';
  for (const id of ["textInput", "attachBtn", "micBtn"]) $(id).disabled = false;
  updateSendBtn();
  $("app").classList.add("in-room");
  renderConvs();
  poll(true);
  if (window.innerWidth > 700) $("textInput").focus();
}

$("back").addEventListener("click", () => {
  if (recorder) cancelRecording();
  $("app").classList.remove("in-room");
  loadConvs();
});

/* ---------- rendering ---------- */
function dayLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "Сегодня " + time;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "Вчера " + time;
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + " " + time;
}

function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

function voiceBubble(m) {
  const wrap = document.createElement("div");
  wrap.className = "voice";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "play";
  btn.innerHTML = ICON_PLAY;
  btn.setAttribute("aria-label", "Воспроизвести");
  const track = document.createElement("div");
  track.className = "track";
  const fill = document.createElement("div");
  fill.className = "fill";
  track.appendChild(fill);
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = fmtDur(m.media.dur);
  wrap.append(btn, track, time);

  let audio = null;
  const ensure = () => {
    if (audio) return audio;
    audio = new Audio("/api/media/" + m.media.id);
    audio.preload = "auto";
    audio.addEventListener("timeupdate", () => {
      const d = isFinite(audio.duration) ? audio.duration : m.media.dur || 1;
      fill.style.width = Math.min(100, (audio.currentTime / d) * 100) + "%";
      time.textContent = fmtDur(audio.currentTime);
    });
    audio.addEventListener("play", () => {
      document.querySelectorAll("audio, video").forEach((x) => x !== audio && x.pause());
      if (window.__playing && window.__playing !== audio) window.__playing.pause();
      window.__playing = audio;
      btn.innerHTML = ICON_PAUSE;
    });
    audio.addEventListener("pause", () => { btn.innerHTML = ICON_PLAY; });
    audio.addEventListener("ended", () => {
      btn.innerHTML = ICON_PLAY;
      fill.style.width = "0";
      time.textContent = fmtDur(m.media.dur);
    });
    return audio;
  };
  btn.onclick = () => {
    const a = ensure();
    a.paused ? a.play().catch(() => alert("Не удалось воспроизвести")) : a.pause();
  };
  track.onclick = (e) => {
    const a = ensure();
    const r = track.getBoundingClientRect();
    const d = isFinite(a.duration) ? a.duration : m.media.dur || 0;
    if (d) a.currentTime = ((e.clientX - r.left) / r.width) * d;
  };
  return wrap;
}

function messageEl(m, prev) {
  const frag = document.createDocumentFragment();
  const newBlock = !prev || m.ts - prev.ts > 15 * 60 * 1000;
  if (newBlock) {
    const s = document.createElement("div");
    s.className = "stamp";
    s.textContent = dayLabel(m.ts);
    frag.appendChild(s);
  }
  const mine = m.name === me;
  const sameAuthor = !newBlock && prev && prev.name === m.name;
  if (!mine && !sameAuthor && conv.kind === "room") {
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = m.name;
    frag.appendChild(who);
  }
  const div = document.createElement("div");
  div.className = "msg" + (mine ? " mine" : "");
  div.title = new Date(m.ts).toLocaleString("ru-RU");
  div.style.marginTop = sameAuthor ? "2px" : (mine || conv.kind === "dm" ? "8px" : "0");
  const src = m.media ? "/api/media/" + m.media.id : "";

  if (m.type === "image") {
    div.classList.add("media");
    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    img.alt = "Фото";
    if (m.media.w && m.media.h) { img.width = m.media.w; img.height = m.media.h; }
    img.onclick = () => { $("viewer").querySelector("img").src = src; $("viewer").hidden = false; };
    div.appendChild(img);
  } else if (m.type === "video") {
    div.classList.add("media");
    const v = document.createElement("video");
    v.src = src + "#t=0.1";
    v.controls = true;
    v.playsInline = true;
    v.preload = "metadata";
    v.addEventListener("play", () => { if (window.__playing) window.__playing.pause(); });
    div.appendChild(v);
  } else if (m.type === "audio") {
    div.appendChild(voiceBubble(m));
  } else {
    div.textContent = m.text;
  }
  frag.appendChild(div);
  return frag;
}

function render(full) {
  const box = $("messages");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  if (full) {
    box.innerHTML = "";
    renderedIds = [];
  }
  if (!cache.length) {
    box.innerHTML = '<div class="empty">' + (conv.kind === "dm" ? "Напишите первое сообщение" : "Сообщений пока нет") + "</div>";
    return;
  }
  const empty = box.querySelector(".empty, .placeholder");
  if (empty) empty.remove();
  const start = renderedIds.length;
  for (let i = start; i < cache.length; i++) {
    box.appendChild(messageEl(cache[i], cache[i - 1]));
    renderedIds.push(cache[i].id);
  }
  if (atBottom || full || cache.slice(start).some((m) => m.name === me)) {
    box.scrollTop = box.scrollHeight;
    // Images load after insertion; keep the view pinned to the bottom when they do.
    box.querySelectorAll("img").forEach((img) => {
      if (!img.complete) img.addEventListener("load", () => { if (box.scrollHeight - box.scrollTop - box.clientHeight < 400) box.scrollTop = box.scrollHeight; }, { once: true });
    });
  }
}

function addMessages(list, fromPoll) {
  let added = false;
  for (const m of list) {
    if (fromPoll && m.id > lastId) lastId = m.id;
    if (cache.some((c) => c.id === m.id)) continue;
    cache.push(m);
    added = true;
  }
  if (!added) { if (!cache.length) render(true); return; }
  cache.sort((a, b) => (a.id < b.id ? -1 : 1));
  // Only rebuild when something landed before an already-rendered message.
  const inOrder = renderedIds.every((id, i) => cache[i] && cache[i].id === id);
  render(!inOrder);
}

/* ---------- polling ---------- */
async function poll(first) {
  clearTimeout(pollTimer);
  if (!conv) return;
  if (polling && !first) return schedule();
  polling = true;
  const forConv = JSON.stringify(conv);
  try {
    const data = await api("messages?" + convQuery() + (lastId ? "&since=" + lastId : ""));
    if (forConv === JSON.stringify(conv)) {
      addMessages(data.messages, true);
      if (!busy) setStatus("");
    }
  } catch (err) {
    setStatus(err.message === "Failed to fetch" ? "Нет связи" : err.message);
  } finally {
    polling = false;
    schedule();
  }
}

function schedule() {
  clearTimeout(pollTimer);
  if (document.visibilityState === "visible") pollTimer = setTimeout(() => poll(false), POLL_MS);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { poll(false); loadConvs(); }
  else clearTimeout(pollTimer);
});

/* ---------- sending ---------- */
async function sendMessage(payload) {
  const target = conv;
  const msg = await api("messages", { method: "POST", json: { ...convBody(), ...payload } });
  if (JSON.stringify(target) === JSON.stringify(conv)) addMessages([msg], false);
  if (conv.kind === "dm" || !convData.rooms.includes(conv.id)) loadConvs();
}

function updateSendBtn() {
  $("sendBtn").disabled = !conv || (!recorder && !$("textInput").value.trim());
}
$("textInput").addEventListener("input", updateSendBtn);

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (recorder) { stopRecording(true); return; }
  const input = $("textInput");
  const text = input.value.trim();
  if (!text || !conv) return;
  input.value = "";
  updateSendBtn();
  try {
    await sendMessage({ type: "text", text });
  } catch (err) {
    input.value = text;
    updateSendBtn();
    alert("Не отправилось: " + err.message);
  }
  input.focus();
});

async function upload(blob, mime) {
  if (blob.size > MAX_UPLOAD) throw new Error("файл больше 4 МБ");
  return api("media", { method: "POST", headers: { "content-type": mime }, body: blob });
}

/* photos & videos */
$("attachBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async () => {
  const file = $("fileInput").files[0];
  $("fileInput").value = "";
  if (!file || !conv) return;
  setBusy(1);
  try {
    if (file.type.startsWith("image/")) {
      const { blob, w, h, mime } = await prepareImage(file);
      const up = await upload(blob, mime);
      await sendMessage({ type: "image", media: { id: up.id, mime, w, h } });
    } else if (file.type.startsWith("video/")) {
      if (file.size > MAX_UPLOAD) {
        throw new Error("видео больше 4 МБ. Бесплатный Netlify принимает только небольшие файлы — отправь ролик покороче (примерно до 10–20 секунд).");
      }
      const mime = file.type === "video/quicktime" ? "video/quicktime" : file.type;
      const up = await upload(file, mime);
      await sendMessage({ type: "video", media: { id: up.id, mime } });
    } else {
      throw new Error("можно отправлять только фото и видео");
    }
  } catch (err) {
    alert("Не отправилось: " + err.message);
  } finally {
    setBusy(-1);
  }
});

async function prepareImage(file) {
  // GIFs keep their animation; everything else is resized to at most 1600px and re-encoded as JPEG.
  if (file.type === "image/gif" && file.size <= MAX_UPLOAD) {
    const bmp = await createImageBitmap(file);
    return { blob: file, w: bmp.width, h: bmp.height, mime: "image/gif" };
  }
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch {
    throw new Error("не удалось открыть фото (формат HEIC? выбери «Наиболее совместимый» в настройках камеры)");
  }
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale);
  const h = Math.round(bmp.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
  let quality = 0.85;
  let blob;
  do {
    blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", quality));
    quality -= 0.15;
  } while (blob.size > MAX_UPLOAD && quality > 0.3);
  return { blob, w, h, mime: "image/jpeg" };
}

/* voice messages */
let recorder = null;
let recChunks = [];
let recStart = 0;
let recTimer = null;
let recSend = false;

function pickAudioMime() {
  const options = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"];
  return options.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}

$("micBtn").addEventListener("click", async () => {
  if (!conv || recorder) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    alert("Этот браузер не умеет записывать звук");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    alert("Нет доступа к микрофону. Разреши его в настройках браузера.");
    return;
  }
  const mime = pickAudioMime();
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
  recChunks = [];
  recSend = false;
  recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => onRecordingStopped(stream);
  recorder.start(250);
  recStart = Date.now();
  $("recTime").textContent = "0:00";
  recTimer = setInterval(() => {
    const sec = (Date.now() - recStart) / 1000;
    $("recTime").textContent = fmtDur(sec);
    if (sec >= MAX_VOICE_SEC) stopRecording(true);
  }, 250);
  setRecordingUi(true);
});

$("recCancel").addEventListener("click", () => cancelRecording());

function setRecordingUi(on) {
  $("textInput").hidden = on;
  $("attachBtn").hidden = on;
  $("micBtn").hidden = on;
  $("recBar").hidden = !on;
  updateSendBtn();
}

function stopRecording(send) {
  if (!recorder) return;
  recSend = send;
  clearInterval(recTimer);
  if (recorder.state !== "inactive") recorder.stop();
}
function cancelRecording() { stopRecording(false); }

async function onRecordingStopped(stream) {
  stream.getTracks().forEach((t) => t.stop());
  const mime = (recorder.mimeType || "audio/webm").split(";")[0];
  const dur = (Date.now() - recStart) / 1000;
  const blob = new Blob(recChunks, { type: mime });
  const send = recSend;
  recorder = null;
  setRecordingUi(false);
  if (!send || dur < 0.7 || !blob.size) return;
  setBusy(1);
  try {
    const up = await upload(blob, mime);
    await sendMessage({ type: "audio", media: { id: up.id, mime, dur: Math.round(dur) } });
  } catch (err) {
    alert("Голосовое не отправилось: " + err.message);
  } finally {
    setBusy(-1);
  }
}

/* image viewer */
$("viewer").addEventListener("click", () => { $("viewer").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("viewer").hidden = true; });

/* ---------- boot ---------- */
token = lsGet("chat.token");
const savedName = lsGet("chat.name");
if (token && savedName) {
  start(savedName);
} else {
  if (savedName) $("nameInput").value = savedName;
  (savedName ? $("passInput") : $("nameInput")).focus();
}
